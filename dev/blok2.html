<!-- wear / your way: «Всего 3 шага» для телефона. Вставить в блок T123 сразу ПОД Zero Block «Всего 3 шага».
     На телефоне этот блок показывается вместо Zero Block, на компьютере он скрыт. -->
<style>
.wys{display:none}
@media (max-width:639px){
  #rec4802592503{display:none!important}           /* Zero Block «Всего 3 шага» скрыт на телефоне */
  html{scroll-snap-type:y proximity}                 /* мягко доводит экран ровно к блоку */
  .wys{display:flex;position:relative;overflow:hidden;background:#fff;scroll-snap-align:start;
       height:100vh;height:100svh;min-height:560px;flex-direction:column;justify-content:space-between;
       padding:calc(env(safe-area-inset-top) + 22px) 24px calc(env(safe-area-inset-bottom) + 18px);

  .wys *{box-sizing:border-box}

  .wys-in{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:flex-start;gap:clamp(14px,2.4vh,24px);flex:1}
  .wys-steps{flex:1;justify-content:space-evenly!important;gap:0!important;margin-top:clamp(4px,1.5vh,14px)!important}
  .wys-sum{padding:clamp(18px,3.4vh,30px) 18px!important}
  .wys-down{margin-top:2px}
  .wys h2{margin:0;padding:0;text-align:center;font-weight:800;font-size:clamp(26px,7.6vw,34px);line-height:1;letter-spacing:.3px;color:#3F1521;white-space:nowrap}
  .wys-steps{position:relative;display:flex;flex-direction:column;gap:clamp(18px,5vh,44px);margin:0 auto;width:100%;max-width:420px}
  .wys-seg{position:absolute;left:30px;width:2px;background:#3F1521;transform-origin:top;transform:scaleY(0);transition:transform .32s cubic-bezier(.45,0,.25,1);z-index:0}
  .wys h2{opacity:0;transform:translateY(24px);transition:opacity .45s ease,transform .5s cubic-bezier(.2,.8,.2,1)}
  .wys-step{display:flex;align-items:center;gap:18px;opacity:0;transform:translateY(32px);transition:opacity .4s ease,transform .45s cubic-bezier(.2,.8,.2,1)}
  .wys-num{flex:none;width:66px;height:66px;border-radius:50%;background:#3F1521;color:#fff;display:grid;place-items:center;font-weight:800;font-size:30px;box-shadow:0 6px 16px rgba(63,21,33,.22);position:relative;z-index:1}
  .wys-t{font-weight:800;font-size:clamp(18px,5.8vw,24px);line-height:1.15;text-transform:uppercase}
  .wys-d{font-size:clamp(14px,4.4vw,18px);line-height:1.4;margin-top:5px;opacity:.85}
  .wys-sum{background:#3F1521;color:#fff;border-radius:22px;padding:20px 18px;text-align:center;opacity:0;transform:translateY(32px);transition:opacity .4s ease,transform .45s cubic-bezier(.2,.8,.2,1)}
  .wys-sum b{display:block;font-weight:800;font-size:clamp(16px,4.8vw,20px);line-height:1.25;letter-spacing:.3px}
  .wys-sum span{display:block;font-size:clamp(13px,3.8vw,15px);line-height:1.4;margin-top:7px;opacity:.85}
  .wys-down{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:#3F1521;opacity:0;transition:opacity .4s ease;-webkit-tap-highlight-color:transparent}
  .wys-down span{font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;opacity:.7}
  .wys-down i{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:#3F1521;animation:wysBob 1.8s ease-in-out infinite}
  .wys-down svg{width:17px;height:17px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  @keyframes wysBob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
  .wys.on h2,.wys.on .wys-step,.wys.on .wys-sum{opacity:1;transform:none}
  .wys.on .wys-seg{transform:scaleY(1)}
  .wys.on .wys-down{opacity:1}
  .wys.on h2{transition-delay:0s}
  .wys.on .s1{transition-delay:.25s}
  .wys.on .g1{transition-delay:.6s}
  .wys.on .s2{transition-delay:.85s}
  .wys.on .g2{transition-delay:1.2s}
  .wys.on .s3{transition-delay:1.45s}
  .wys.on .wys-sum{transition-delay:1.8s}
  .wys.on .wys-down{transition-delay:2.1s}
  @media (max-height:640px){.wys-num{width:52px;height:52px;font-size:24px}.wys{padding-top:calc(env(safe-area-inset-top) + 18px)}}
  @media (prefers-reduced-motion:reduce){.wys h2,.wys-step,.wys-sum,.wys-down,.wys-seg{transition:none!important}.wys-down i{animation:none}}
}
</style>
<section class="wys" id="wys-steps" aria-label="Всего 3 шага">
  <img class="wys-deco" alt="" src="https://static.tildacdn.pro/tild3838-3961-4433-a632-316665333638/02-S-verh-levo.png" style="left:-20%;top:16%;width:34%;opacity:.45;filter:blur(5px)">
  <img class="wys-deco" alt="" src="https://static.tildacdn.pro/tild6239-3830-4037-b439-663062376131/01-petlya-verh-pravo.png" style="right:-9%;top:7%;width:24%;opacity:.5;filter:blur(2px)">
  <img class="wys-deco" alt="" src="https://static.tildacdn.pro/tild3665-6463-4766-a465-653861356336/05-koltso-levo-obrez.png" style="right:-17%;bottom:13%;width:34%;opacity:.4;filter:blur(3px)">
  <div class="wys-in">
    <h2>ВСЕГО 3 ШАГА</h2>
    <div class="wys-steps">
      <div class="wys-seg g1"></div><div class="wys-seg g2"></div>
      <div class="wys-step s1"><div class="wys-num">1</div><div><div class="wys-t">Выбираешь вещь</div><div class="wys-d">Размер, цвет и модель: футболка или лонгслив</div></div></div>
      <div class="wys-step s2"><div class="wys-num">2</div><div><div class="wys-t">Собираешь дизайн</div><div class="wys-d">Стикеры и патчи в конструкторе</div></div></div>
      <div class="wys-step s3"><div class="wys-num">3</div><div><div class="wys-t">Отправляешь</div><div class="wys-d">Мы прессуем принты и отправляем готовую вещь</div></div></div>
    </div>
    <div class="wys-sum"><b>ИТОГ = ИЗДЕЛИЕ<br>+ СТИКЕРЫ И ПАТЧИ</b><span>Сумма считается в конструкторе сразу</span></div>
    <a class="wys-down" href="#rec4796228203" aria-label="Перейти к конструктору"><span>Конструктор ниже</span><i><svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></i></a>
  </div>
</section>
<script>
(function(){
  var s=document.getElementById('wys-steps');if(!s)return;
  function segs(){
    var box=s.querySelector('.wys-steps'),n=box.querySelectorAll('.wys-num'),g=box.querySelectorAll('.wys-seg'),br=box.getBoundingClientRect();
    for(var i=0;i<2;i++){
      var a=n[i].getBoundingClientRect(),b=n[i+1].getBoundingClientRect(),x=a.left+a.width/2-br.left-1;
      /* учитываем, что шаги ещё сдвинуты анимацией */
      var off=parseFloat(getComputedStyle(n[i].parentNode).transform.split(',')[5])||0,offb=parseFloat(getComputedStyle(n[i+1].parentNode).transform.split(',')[5])||0;
      g[i].style.left=x+'px';g[i].style.top=(a.bottom-off-br.top)+'px';g[i].style.height=Math.max(0,(b.top-offb)-(a.bottom-off))+'px';
    }
  }
  /* обрезаем пустой белый низ первого блока на телефоне: он заканчивается там, где кончается голубой фон */
  function trimHero(){
    var rec=document.getElementById('rec4628251903');if(!rec)return;
    var ab=rec.querySelector('.t396__artboard'),bg=rec.querySelector('.wr-bg'),parts=[ab,rec.querySelector('.t396__carrier'),rec.querySelector('.t396__filter')];
    if(!ab||!bg)return;
    if(window.innerWidth>639){parts.forEach(function(n){n&&n.style.removeProperty('height')});return}
    var h=Math.round(bg.getBoundingClientRect().bottom-ab.getBoundingClientRect().top);
    if(h>300&&h<ab.offsetHeight+1){parts.forEach(function(n){n&&n.style.setProperty('height',h+'px','important')});ab.style.overflow='hidden'}
  }
  trimHero();window.addEventListener('load',trimHero);window.addEventListener('resize',function(){setTimeout(trimHero,300)});setTimeout(trimHero,1200);setTimeout(trimHero,3000);
  segs();window.addEventListener('resize',segs);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(segs);setTimeout(segs,800);
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting&&e.intersectionRatio>.35){s.classList.add('on');io.disconnect()}})},{threshold:[0,.35,.6]});
    io.observe(s);
  }else s.classList.add('on');
  var a=s.querySelector('.wys-down');
  a.addEventListener('click',function(ev){
    var b=document.getElementById('wear-studio-builder'),t=(b&&(b.closest('.t-rec')||b))||document.querySelector(a.getAttribute('href'));
    if(!t)return;ev.preventDefault();window.scrollTo({top:t.getBoundingClientRect().top+window.pageYOffset,behavior:'smooth'});
  });
})();
</script>
